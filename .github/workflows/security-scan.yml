name: Security Scan

# Weekly vulnerability scan of the published images of every supported line.
# Dependabot only targets develop, so this is what notices a new CVE in a
# dependency or base image of a release that is already out. A HIGH/CRITICAL
# finding on a supported line leads to a patch release (RELEASING.md), even if
# the only change is a dependency or base-image bump.
#
# Results land in Security → Code scanning, one category per image.

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `latest` plus each supported X.Y line (SECURITY.md, "Supported versions").
        # Keep in sync when a line is added or drops out of support.
        line: ['latest', '3.0']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # all tags, so release-rank.sh can resolve a line to its newest release
          fetch-depth: 0

      - name: Resolve image
        id: image
        env:
          LINE: ${{ matrix.line }}
        run: |
          # an X.Y line is scanned at its newest release tag, which exists even
          # before the line's first patch release publishes the moving :X.Y tag
          if [ "$LINE" = "latest" ]; then
            TAG=latest
          else
            TAG=$(scripts/release-rank.sh newest-in-line "$LINE")
          fi
          echo "Scanning openfhir/openfhir:$TAG"
          echo "ref=openfhir/openfhir:$TAG" >> "$GITHUB_OUTPUT"

      - name: Scan image
        # pinned by commit: a security tool runs with this workflow's permissions
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif

      - name: Upload results to code scanning
        if: ${{ always() && hashFiles('trivy-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: image-${{ matrix.line }}
