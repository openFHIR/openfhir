name: Changelog Check

on:
  pull_request:
    # labeled/unlabeled so applying 'no-changelog' re-runs (and passes) the check
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  changelog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if changelog was modified
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
        run: |
          # Get list of changed files
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)

          echo "Changed files:"
          echo "$CHANGED_FILES"

          # Check if CHANGELOG.md is in changed files
          if echo "$CHANGED_FILES" | grep -q "^CHANGELOG.md$"; then
            echo "CHANGELOG.md updated ✔"
          else
            echo "ERROR: CHANGELOG.md was not updated."
            echo "Please add a changelog entry or apply the 'no-changelog' label."
            exit 1
          fi
