name: Release Tooling

# Tests of the release scripts (scripts/test-forward-merge.sh), on PRs that change
# them. The same file is in openfhir and openfhir-enterprise.

on:
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/workflows/patch-release.yml'
      - '.github/workflows/forward-merge-check.yml'
      - '.github/workflows/release-tooling.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Test scripts/forward-merge.sh
        run: scripts/test-forward-merge.sh
