name: Publish Docker Image

on:
  push:
    branches:
      - develop
    # only semver release tags publish a versioned image and move :latest
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # all tags, so release-rank.sh can rank this release against them
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Determine tags
        id: tags
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            TAGS="openfhir/openfhir:${TAG_NAME}"
            # moving tags only move forwards: a patch on an older line (or a
            # re-run of an old tag) must not pull :X.Y or :latest backwards
            if scripts/release-rank.sh is-newest-in-line "$TAG_NAME"; then
              TAGS="${TAGS},openfhir/openfhir:${TAG_NAME%.*}"
            fi
            if scripts/release-rank.sh is-newest "$TAG_NAME"; then
              TAGS="${TAGS},openfhir/openfhir:latest"
            fi
            echo "tags=${TAGS}"
            echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=openfhir/openfhir:build" >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # SBOM and provenance attestations, stored with the image on Docker Hub
          sbom: true
          provenance: mode=max
