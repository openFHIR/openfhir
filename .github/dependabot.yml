# Dependency updates for develop. Dependabot (including its security updates)
# only targets develop: supported release lines (release/X.Y) are covered by
# security-scan.yml, whose findings lead to a patch release.
# Every PR gets 'no-changelog' so changelog-check.yml passes: dependency bumps need no
# CHANGELOG.md entry. Setting labels replaces Dependabot's defaults, hence 'dependencies'.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    target-branch: develop
    labels: [dependencies, no-changelog]
    schedule:
      interval: weekly
    groups:
      maven-minor-and-patch:
        update-types: [minor, patch]

  # base images in the Dockerfile are pinned by digest; this bumps the digests
  - package-ecosystem: docker
    directory: /
    target-branch: develop
    labels: [dependencies, no-changelog]
    schedule:
      interval: weekly
    groups:
      docker-minor-and-patch:
        update-types: [minor, patch]
    # Moving to another Java version is a deliberate change (LTS releases only, builder and runtime together),
    # so only digest bumps of the current tags come through here. Dependabot reads the maven tag
    # 3.9-eclipse-temurin-21 as version 3.9.21, so a Java change there looks like a patch bump: ignore every
    # tag change for it, not just major ones.
    ignore:
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
      - dependency-name: "maven"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    labels: [dependencies, no-changelog]
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
