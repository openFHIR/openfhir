grammar: FHIRConnect/v1.0.0
type: model
metadata:
  name:  ADMIN_ENTRY.versicherungsinformationen.v0
  version: 0.0.1-alpha
spec:
  system: FHIR
  version: R4
  openEhrConfig:
    archetype: openEHR-EHR-ADMIN_ENTRY.versicherungsinformationen.v0
    revision: 0.0.1-alpha
  fhirConfig:
    structureDefinition: http://hl7.org/fhir/StructureDefinition/Identifier

mappings:
  - name: "versicherungsId"
    with:
      fhir: "$fhirRoot"
      openehr: "$archetype/data[at0001]/items[at0006]"
    fhirCondition:
      targetRoot: "$fhirRoot"
      targetAttribute: "system"
      operator: "one of"
      criteria: "http://fhir.de/sid/gkv/kvid-10"
    followedBy:
      mappings:
        - name: "staticUrl"
          with:
            fhir: "$fhirRoot"
            openehr: "$openehrRoot"
          manual:
            - name: "system"
              fhir:
                - path: "system"
                  value: "http://fhir.de/sid/gkv/kvid-10"

        # A DV_IDENTIFIER that carries its |type already yields this coding; the manual is the fallback
        # for one that does not. Without the condition the same coding would be added twice, since a
        # re-walked single-valued 'type' is continued into rather than replaced.
        - name: "typeCoding"
          with:
            fhir: "type.coding"
            openehr: "$archetype"
          openehrCondition:
            targetRoot: "$archetype/data[at0001]/items[at0006]"
            targetAttribute: "type"
            operator: "empty"
          manual:
            - name: "type"
              fhir:
                - path: "system"
                  value: "http://fhir.de/CodeSystem/identifier-type-de-basis"
                - path: "code"
                  value: "KVZ10"

