grammar: FHIRConnect/v1.0.0
type: extension
metadata:
  name: KDS_laborbericht
  version: 0.0.1-alpha
spec:
  system: FHIR
  version: R4
  extends: OBSERVATION.laboratory_test_result.v1

mappings:
  - name: "compositionMapping"
    extension: "add"
    with:
      fhir: "$resource"
      openehr: "$composition"
    slotArchetype: "COMPOSITION.report_result.v1.DiagnosticReport"

  - name: "metaURL"
    extension: "add"
    unidirectional: "openEHR->fhir"
    with:
      fhir: "$resource.meta"
    manual:
      - name: "profileUrl"
        fhir:
          - path: "profile"
            value: "https://www.medizininformatik-initiative.de/fhir/core/modul-labor/StructureDefinition/DiagnosticReportLab"


  - name: "resultAppendToParent" #/data[at0001]/events[at0002] add new for each laboratory analyte.
    extension: "append"
    appendTo: "eventParent"
    followedBy:
      mappings:
        - name: "result"
          with:
            fhir: "result"
            openehr: "data[at0003]/items[openEHR-EHR-CLUSTER.laboratory_test_analyte.v1]"
          followedBy:
            mappings:
              - name: "observationReference"
                with:
                  fhir: "$fhirRoot"
                  openehr: "$reference"
                reference:
                  resourceType: "Observation"
                  mappings:
                    - name: "observationRecurring"
                      with:
                        fhir: "$fhirRoot"
                        openehr: "$openehrRoot"
                      slotArchetype: "CLUSTER.laboratory_test_analyte.v1"

  - name: "status"
    extension: "overwrite"
    with:
      fhir: "$resource.status"
      openehr: "$composition/context/other_context[at0001]/items[at0005]"






