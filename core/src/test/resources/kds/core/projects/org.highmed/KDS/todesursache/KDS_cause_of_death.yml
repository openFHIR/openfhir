grammar: FHIRConnect/v1.0.0
type: extension
metadata:
  name: KDS_cause_of_death
  version: 0.0.1-alpha
spec:
  system: FHIR
  version: R4
  extends: EVALUATION.cause_of_death.v1

mappings:
  - name: "metaURL"
    extension: "add"
    unidirectional: "openEHR->fhir"
    with:
      fhir: "$resource.meta"
    manual:
      - name: "profileUrl"
        fhir:
          - path: "profile"
            value: "https://www.medizininformatik-initiative.de/fhir/core/modul-person/StructureDefinition/Todesursache"

  - name: "compositionMapping"
    extension: "add"
    with:
      fhir: "$resource"
      openehr: "$composition"
    slotArchetype: "COMPOSITION.report.v1.Condition"