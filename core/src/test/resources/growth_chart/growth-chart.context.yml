grammar: FHIRConnect/v0.0.1
type: context
metadata:
  name: "Growth chart"
  version: 0.0.1a # version of this particular mapping
spec: # schema specific to the FHIRConnect v0.0.1 engine
  system: FHIR
  version: R4

context:
  profile:
    url: "Bundle"
  template:
    id: "Growth chart"
  archetypes:
    - "OBSERVATION.body_weight.v2"
    - "OBSERVATION.height.v2"
    - "OBSERVATION.body_mass_index.v2"
    - "OBSERVATION.head_circumference.v1"
    - "openEHR-EHR-COMPOSITION.growth_chart.v0"
  start: "openEHR-EHR-COMPOSITION.growth_chart.v0"
  _query:
    - aql: "SELECT c FROM EHR e[ehr_id/value='{{ehrid}}'] CONTAINS COMPOSITION c WHERE c/archetype_details/template_id/value='something'"
      rules:
        - "$summary"
    - aql: "SELECT c FROM EHR e[ehr_id/value='{{ehrid}}'] CONTAINS COMPOSITION c WHERE c/archetype_details/template_id/value='something-else'"
      rules:
        - "Observation?category=height"