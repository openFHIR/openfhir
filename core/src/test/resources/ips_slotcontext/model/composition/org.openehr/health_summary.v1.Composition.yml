# Generic health summary composition model. Profile-specific content (e.g. the
# IPS profile, title, type and sections) is added by project extensions such as
# projects/org.openehr/IPS/IPS_composition.yml.
grammar: FHIRConnect/v1.0.0
type: model
metadata:
  name: COMPOSITION.health_summary.v1
  version: 0.0.1-alpha
spec:
  system: FHIR
  version: R4
  openEhrConfig:
    archetype: openEHR-EHR-COMPOSITION.health_summary.v1
    revision: 1.0.3
  fhirConfig:
    structureDefinition: http://hl7.org/fhir/StructureDefinition/Composition

preprocessor:
  fhirCondition:
    targetRoot: "$resource" # skip compositions that were entered in error; preliminary, final and amended are mapped
    targetAttribute: "status"
    operator: "not of"
    criteria: "entered-in-error"

mappings:
  - name: status
    with:
      fhir: "$resource"
      openehr: "$composition"
    manual:
      - name: "status"
        fhir:
          - path: "status"
            value: "final"

  - name: "date"
    with:
      fhir: "$resource.date"
      openehr: "$composition/context/start_time" # export only; the true document time is the commit time of the versioned object
    unidirectional: "openehr->fhir"

  - name: "author"
    with:
      fhir: "$resource.author"
      openehr: "$composition/composer"
