grammar: FHIRConnect/v1.0.0
type: model
metadata:
  name: EVALUATION.exclusion_global.v1
  version: 0.0.1-alpha
spec:
  system: FHIR
  version: R4
  openEhrConfig:
    archetype: openEHR-EHR-EVALUATION.exclusion_global.v1
  fhirConfig:
    structureDefinition: "http://hl7.org/fhir/StructureDefinition/CodeableConcept"

# Counterpart of EVALUATION.absence.v2 for list-empty-reason "nilknown"
# (e.g. "no known problems", "no known allergies").
mappings:

  - name: "text"
    with:
      fhir: "text"
      openehr: "data[at0001]/items[at0002]"

  - name: "coding"
    with:
      fhir: "coding"
      openehr: "$archetype"
    followedBy:
      mappings:
        - name: "code"
          with:
            fhir: "$fhirRoot"
            openehr: "$archetype"
          manual:
            - name: "codeManual"
              fhir:
                - path: "code"
                  value: "nilknown"

        - name: "system"
          with:
            fhir: "$fhirRoot"
            openehr: "$archetype"
          manual:
            - name: "systemManual"
              fhir:
                - path: "system"
                  value: "http://terminology.hl7.org/CodeSystem/list-empty-reason"

        - name: "display" # same node as text; only read it, never let it overwrite the statement
          with:
            fhir: "display"
            openehr: "$archetype/data[at0001]/items[at0002]"
          unidirectional: "openehr->fhir"
