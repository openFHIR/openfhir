grammar: FHIRConnect/v0.0.1
type: model
metadata:
  name: "openEHR-EHR-COMPOSITION.blood_pressure.v0"
  version: 0.0.1a
spec:
  system: FHIR
  version: R4
  openEhrConfig:
    archetype: "openEHR-EHR-COMPOSITION.blood_pressure.v0"
  fhirConfig:
    structureDefinition: http://hl7.org/fhir/StructureDefinition/Bundle

mappings:

  # one Bundle entry per OBSERVATION instance (not per event, as in /manual_multipath/), so the
  # three events' repeating elements all land on the same Observation
  - name: "bpParent"
    with:
      fhir: "$resource.entry"
      openehr: "$composition/content[openEHR-EHR-OBSERVATION.blood_pressure.v2]"
    fhirCondition:
      targetRoot: "$resource.entry"
      targetAttribute: "resource"
      operator: "type"
      criterias:
        - "Observation"
    followedBy:
      mappings:
        - name: "iterateBpObservations"
          with:
            fhir: "resource"
            openehr: "$reference"
          reference:
            resourceType: "Observation"
            mappings:
              - name: "bpSlot"
                with:
                  fhir: "$fhirRoot"
                  openehr: "$composition/content[openEHR-EHR-OBSERVATION.blood_pressure.v2]"
                slotArchetype: "OBSERVATION.blood_pressure.v2"
